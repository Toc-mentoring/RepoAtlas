# RepoAtlas 단일 서버 배포: PostgreSQL + migration + API + Worker + Nginx(프론트).
# 실행: cd infra && cp .env.example .env (값 채우기) && docker compose up -d --build
# 외부에 열리는 포트는 web 하나뿐이다. DB와 API는 내부 네트워크로만 연결된다.
name: repoatlas

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://repoatlas:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@db:5432/repoatlas
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}

x-app: &app
  build:
    context: ..
    dockerfile: infra/api.Dockerfile
  image: repoatlas-app:latest
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repoatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: repoatlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoatlas -d repoatlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    environment: *app-env
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *app
    environment:
      <<: *app-env
      MAX_ARCHIVE_BYTES: ${MAX_ARCHIVE_BYTES:-536870912}
      MAX_EXTRACTED_BYTES: ${MAX_EXTRACTED_BYTES:-2147483648}
      MAX_FILES: ${MAX_FILES:-100000}
      MAX_SOURCE_FILE_BYTES: ${MAX_SOURCE_FILE_BYTES:-1048576}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-900}
    command: ["python", "-m", "worker.main"]
    # 수집한 코드는 실행하지 않지만, 분석 중 메모리 사용량에 상한을 둔다.
    mem_limit: 1536m
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    image: repoatlas-web:latest
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

volumes:
  pgdata:
