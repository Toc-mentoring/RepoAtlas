[project]
name = "repoatlas"
version = "0.1.0"
description = "RepoAtlas analysis worker and shared database models"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.162.0",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=25,<30",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "worker/tests"]
pythonpath = ["."]
